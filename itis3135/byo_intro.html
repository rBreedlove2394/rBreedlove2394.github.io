<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BYO Intro - Ryan Breedlove</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
    <script src="scripts/survey.js" defer></script>


</head>

<body>
<header>
    <div data-include="components/header.html"></div>
</header>

<main>
    <h2>Build Your Own Intro Page</h2>
    <h3>Time to BYO Intro page, please fill out the form below so we can create your own page.</h3>

    <form id="introForm">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="mascot">Mascot:</label>
        <input type="text" id="mascot" name="mascot" required>

        <label for="image">Image:</label>
        <input type="file" id="image" name="image" accept="image/png, image/jpeg" required>

        <label for="imageCaption">Image Caption:</label>
        <input type="text" id="imageCaption" name="imageCaption" required>

        <label for="personalBackground">Personal Background:</label>
        <textarea id="personalBackground" name="personalBackground" required></textarea>

        <label for="professionalBackground">Professional Background:</label>
        <textarea id="professionalBackground" name="professionalBackground" required></textarea>

        <label for="academicBackground">Academic Background:</label>
        <textarea id="academicBackground" name="academicBackground" required></textarea>

        <label for="webDevBackground">Background in Web Development:</label>
        <textarea id="webDevBackground" name="webDevBackground" required></textarea>

        <label for="platform">Primary Computer Platform:</label>
        <input type="text" id="platform" name="platform" required>

        <div id="coursesContainer">
            <label>Courses Currently Taking:</label><br>
            <button type="button" onclick="addCourse()">Add Course</button>
        </div>

        <label for="funnyThing">Funny Thing?</label>
        <textarea id="funnyThing" name="funnyThing"></textarea>

        <label for="anythingElse">Anything Else?</label>
        <textarea id="anythingElse" name="anythingElse"></textarea>

        <label>
            <input type="checkbox" id="agree" name="agree" required>
            I understand that what is on this page is not password protected and I will not put anything here that I don’t want publicly available.
        </label>

        <div style="margin-top: 20px;">
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>
    </form>

    <div id="output"></div>

</main>

<footer>
    <div data-include="components/footer.html"></div>
</footer>

<script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
