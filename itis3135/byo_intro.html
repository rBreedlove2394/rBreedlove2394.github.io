<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BYO Intro - Ryan Breedlove</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>
</head>

<body>
<header>
    <div data-include="components/header.html"></div>
</header>
<main>
    <h2>Build Your Own Intro Page</h2>
    <h3>Time to BYO Intro page, please fill out the form below so we can create your own page.</h3>

    <form id="introForm">
        <label>Name: <input type="text" id="name" required></label><br>
        <label>Mascot: <input type="text" id="mascot" required></label><br>
        <label>Image: <input type="file" id="image" accept="image/png, image/jpeg" required></label><br>
        <label>Image Caption: <input type="text" id="imageCaption" required></label><br>

        <label>Personal Background:<br>
            <textarea id="personalBackground" required></textarea>
        </label><br>

        <label>Professional Background:<br>
            <textarea id="professionalBackground" required></textarea>
        </label><br>

        <label>Academic Background:<br>
            <textarea id="academicBackground" required></textarea>
        </label><br>

        <label>Background in Web Development:<br>
            <textarea id="webDevBackground" required></textarea>
        </label><br>

        <label>Primary Computer Platform:<br>
            <input type="text" id="platform" required>
        </label><br>

        <div id="coursesContainer">
            <label>Courses Currently Taking:</label><br>
            <button type="button" onclick="addCourse()">Add Course</button>
        </div><br>

        <label>Funny Thing?<br>
            <textarea id="funnyThing"></textarea>
        </label><br>

        <label>Anything Else?<br>
            <textarea id="anythingElse"></textarea>
        </label><br>

        <label>
            <input type="checkbox" id="agree" required>
            I understand that what is on this page is not password protected and I will not put anything here that I don’t want publicly available.
        </label><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>

    <section id="output" style="display:none;"></section>
</main>
<footer>
    <div data-include="components/footer.html"></div>
</footer>
<script src="scripts/HTMLInclude.min.js"></script>
</body>
</html>
